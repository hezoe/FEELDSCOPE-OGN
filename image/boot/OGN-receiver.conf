# =============================================================================
#  FEELDSCOPE 受信機の設定（このファイルを書き換えてから、SD カードを受信機に挿して電源を入れます）
#  - 「"" 」の間に値を書きます。「#」から行末まではメモ（説明）で、動作には関係しません。
#  - 書き終わったら上書き保存してください。電源を入れると自動で FEELDSCOPE がインストールされます（30〜40分）。
# =============================================================================

### 必須 ###
ReceiverName=""     # 受信機名。英字と数字だけで3〜9文字（記号・空白は不可）。例: Sekiyado1、Takikawa2
Latitude=""         # 受信機を置く場所の緯度（10進数）。例: 36.0123
Longitude=""        # 受信機を置く場所の経度（10進数）。例: 139.8456
                    #   Google マップの座標（例 36.0123, 139.8456）は、前が緯度・後ろが経度です。
                    #   自宅に置く場合は、近くの公共の場所（公園など）の座標にずらしてかまいません。受信性能には影響しません。

### SSH のパスワード（必須）###
piUserPassword=""   # 受信機に SSH でログインするときの pi ユーザーのパスワード。
                    #   英字と数字だけにしてください。記号はキーボードの配列によって別の文字になることがあります。
                    #   電源を入れるたびにこの値に設定し直されます。変えたいときはこのファイルを書き換えてください。

### Wi-Fi（有線 LAN でつなぐ場合は空欄のまま）###
wifiName=""         # Wi-Fi の名前（SSID）
wifiPassword=""     # Wi-Fi のパスワード
wifiCountry="JP"    # 国コード。日本は JP のまま

### 日本向けの設定（通常は変更不要）###
GSMCenterFreq="922.4"
OGNBINARYURL="http://download.glidernet.org/arm/rtlsdr-ogn-bin-ARM-latest.tgz?version=japan"
EnableCoreOGNTeamRemoteAdmin="true"
# FreqCorr=""       # 受信周波数の補正（ppm）
# Altitude=""       # アンテナの高さ（m）
# enableBias="1"    # バイアスティー（対応ドングルのみ。普通のアンテナで使うとドングルが壊れることがあります）
