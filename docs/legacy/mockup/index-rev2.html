<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEELDSCOPE - FLARM FS Monitor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-tertiary: #0f3460;
  --bg-card: #1e2a4a;
  --text-primary: #e8e8e8;
  --text-secondary: #a0a0b0;
  --accent: #00b4d8;
  --accent-dim: #0077b6;
  --danger: #e63946;
  --danger-dim: rgba(230, 57, 70, 0.25);
  --warning: #f4a261;
  --success: #2a9d8f;
  --border: #2a3a5e;
  --tow-color: #f4a261;
  --glider-color: #00b4d8;
  --motor-glider-color: #8ac926;
  --heli-color: #e07be0;
  --recip-color: #cccccc;
  --jet-color: #ff6b6b;
  --uav-color: #ffd166;
}

body {
  font-family: 'Segoe UI', 'Meiryo', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 16px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  min-height: 48px;
  flex-shrink: 0;
}

.header-logo {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--accent);
}

.header-airfield {
  font-size: 14px;
  color: var(--text-secondary);
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-left: auto;
}

.header-controls label {
  font-size: 12px;
  color: var(--text-secondary);
}

/* R/W Spinner */
.rw-spinner {
  display: flex;
  align-items: center;
  gap: 2px;
}

.rw-spinner .rw-display {
  background: var(--bg-primary);
  color: var(--accent);
  border: 1px solid var(--border);
  padding: 3px 8px;
  border-radius: 3px;
  font-size: 15px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  min-width: 60px;
  text-align: center;
}

.rw-spinner .rw-btn {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 10px;
  border-radius: 3px;
  line-height: 1;
}

.rw-spinner .rw-btn:hover { background: var(--accent-dim); }

.rw-spinner .rw-btns {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.header-controls button {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
}

.header-controls button:hover { background: var(--accent-dim); }

.btn-settings {
  display: flex;
  align-items: center;
  gap: 4px;
}

.clock {
  font-size: 20px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  min-width: 70px;
  text-align: right;
}

/* ── Main area ── */
.main {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── Map ── */
.map-container {
  flex: 1;
  position: relative;
}

#map {
  width: 100%;
  height: 100%;
  background: #0a0a1a;
}

.map-overlay-btn {
  position: absolute;
  z-index: 1000;
  background: var(--bg-secondary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 13px;
}

.map-overlay-btn:hover { background: var(--accent-dim); }

.btn-home { top: 10px; right: 10px; }
.btn-save-home { top: 44px; right: 10px; font-size: 11px; }

/* ── Status view ── */
.status-view {
  width: 280px;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
}

.status-section {
  border-bottom: 1px solid var(--border);
}

.status-section-header {
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: var(--bg-primary);
  color: var(--text-secondary);
}

.status-section-header.danger {
  background: var(--danger-dim);
  color: var(--danger);
}

.status-item {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  gap: 8px;
  border-bottom: 1px solid rgba(42, 58, 94, 0.5);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
}

.status-item:hover { background: rgba(0, 180, 216, 0.08); }

.status-item.active {
  background: rgba(0, 180, 216, 0.15);
  outline: 1px solid var(--accent);
}

.status-item.lost-signal {
  background: var(--danger-dim);
  color: rgba(230, 57, 70, 0.8);
}

.status-item .reg {
  font-weight: 600;
  min-width: 65px;
}

.status-item .type {
  color: var(--text-secondary);
  font-size: 11px;
  flex: 1;
}

.status-item .alt {
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  text-align: right;
  min-width: 55px;
}

.status-item .alt.danger {
  color: var(--danger);
  font-weight: 700;
}

.status-item .category-badge {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 600;
}

.badge-tow    { background: rgba(244, 162, 97, 0.2); color: var(--tow-color); }
.badge-glider { background: rgba(0, 180, 216, 0.2);   color: var(--glider-color); }
.badge-motor  { background: rgba(138, 201, 38, 0.2);  color: var(--motor-glider-color); }
.badge-heli   { background: rgba(224, 123, 224, 0.2); color: var(--heli-color); }
.badge-recip  { background: rgba(204, 204, 204, 0.15);color: var(--recip-color); }
.badge-jet    { background: rgba(255, 107, 107, 0.2); color: var(--jet-color); }
.badge-uav    { background: rgba(255, 209, 102, 0.2); color: var(--uav-color); }

/* ── Flight records ── */
.records-panel {
  height: 260px;
  min-height: 200px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.records-tabs {
  display: flex;
  align-items: center;
  padding: 0 8px;
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border);
  gap: 2px;
}

.records-tab {
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  color: var(--text-secondary);
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  transition: all 0.15s;
}

.records-tab:hover { color: var(--text-primary); }

.records-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.records-tab-actions {
  margin-left: auto;
  display: flex;
  gap: 6px;
}

.records-tab-actions button {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
}

.records-tab-actions button:hover { background: var(--accent-dim); }

.records-body {
  flex: 1;
  overflow: auto;
}

.records-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.records-table th {
  position: sticky;
  top: 0;
  background: var(--bg-primary);
  color: var(--text-secondary);
  font-weight: 600;
  text-align: left;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  font-size: 11px;
}

.records-table td {
  padding: 5px 10px;
  border-bottom: 1px solid rgba(42, 58, 94, 0.3);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.records-table tr:hover td { background: rgba(0, 180, 216, 0.05); }

.records-table .editable {
  cursor: pointer;
  border-bottom: 1px dashed var(--accent-dim);
}

.records-table .editable:hover { color: var(--accent); }

.records-table .flag-edu {
  color: var(--warning);
  font-weight: 600;
}

.records-table .btn-row {
  padding: 2px 6px;
  font-size: 10px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
}

.records-table .btn-row:hover {
  background: var(--accent-dim);
  color: var(--text-primary);
}

/* ── Resize handle ── */
.resize-handle {
  height: 4px;
  background: var(--border);
  cursor: ns-resize;
  flex-shrink: 0;
}

.resize-handle:hover { background: var(--accent); }

/* ── Settings modal ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 2000;
  justify-content: center;
  align-items: center;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 520px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px;
}

.modal h2 {
  font-size: 16px;
  margin-bottom: 16px;
  color: var(--accent);
}

.modal h3 {
  font-size: 13px;
  margin: 16px 0 8px;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}

.modal-field {
  margin-bottom: 10px;
}

.modal-field label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 3px;
}

.modal-field input, .modal-field select {
  width: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 5px 10px;
  border-radius: 4px;
  font-size: 13px;
}

.modal-row {
  display: flex;
  gap: 10px;
}

.modal-row .modal-field { flex: 1; }

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.modal-actions button {
  padding: 6px 16px;
  border-radius: 4px;
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 13px;
}

.modal-actions .btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.modal-actions .btn-secondary {
  background: var(--bg-tertiary);
  color: var(--text-primary);
}

/* ── Blink animation for selected aircraft ── */
@keyframes blink-marker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}

.aircraft-blink .aircraft-icon {
  animation: blink-marker 0.6s ease-in-out infinite;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

.empty-state {
  text-align: center;
  padding: 16px;
  color: var(--text-secondary);
  font-size: 12px;
}
</style>
</head>
<body>

<!-- ══════════ Header ══════════ -->
<div class="header">
  <div class="header-logo">FEELDSCOPE</div>
  <div class="header-airfield">滝川スカイパーク</div>
  <div class="header-controls">
    <label>R/W:</label>
    <div class="rw-spinner">
      <div class="rw-display" id="rwDisplay">36 / 18</div>
      <div class="rw-btns">
        <button class="rw-btn" onclick="changeRW(1)" title="方位+1">&#9650;</button>
        <button class="rw-btn" onclick="changeRW(-1)" title="方位-1">&#9660;</button>
      </div>
    </div>
    <button class="btn-settings" onclick="openSettings()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
      設定
    </button>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</div>

<!-- ══════════ Main area ══════════ -->
<div class="main">
  <!-- Map -->
  <div class="map-container">
    <div id="map"></div>
    <button class="map-overlay-btn btn-home" onclick="goHome()" title="ホームポジションに戻る">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      HOME
    </button>
    <button class="map-overlay-btn btn-save-home" onclick="saveHome()" title="現在の表示をホームポジションとして保存">保存</button>
  </div>

  <!-- Status view -->
  <div class="status-view">
    <div class="status-section" id="lostSection">
      <div class="status-section-header danger">通信途絶</div>
      <div id="lostList"></div>
    </div>
    <div class="status-section" id="airborneSection">
      <div class="status-section-header">▲ 上空</div>
      <div id="airborneList"></div>
    </div>
    <div class="status-section" id="groundSection">
      <div class="status-section-header">▼ 地上</div>
      <div id="groundList"></div>
    </div>
  </div>
</div>

<!-- Resize handle -->
<div class="resize-handle" id="resizeHandle"></div>

<!-- ══════════ Flight records ══════════ -->
<div class="records-panel" id="recordsPanel">
  <div class="records-tabs">
    <button class="records-tab active" data-tab="tow1" onclick="switchTab('tow1', this)">曳航機1</button>
    <button class="records-tab" data-tab="tow2" onclick="switchTab('tow2', this)">曳航機2</button>
    <button class="records-tab" data-tab="glider" onclick="switchTab('glider', this)">滑空機・動力滑空機</button>
    <div class="records-tab-actions">
      <button onclick="addRecord()">+ 追加</button>
      <button onclick="exportCSV()">CSV</button>
      <button onclick="exportExcel()">Excel</button>
    </div>
  </div>
  <div class="records-body">
    <!-- Tow 1 -->
    <table class="records-table" id="tableTow1">
      <thead><tr>
        <th>#</th><th>離陸時刻</th><th>着陸時刻</th><th>被曳航機</th><th>離脱高度(ft)</th><th>備考</th><th></th>
      </tr></thead>
      <tbody id="tow1Body"></tbody>
    </table>
    <!-- Tow 2 -->
    <table class="records-table" id="tableTow2" style="display:none;">
      <thead><tr>
        <th>#</th><th>離陸時刻</th><th>着陸時刻</th><th>被曳航機</th><th>離脱高度(ft)</th><th>備考</th><th></th>
      </tr></thead>
      <tbody id="tow2Body"></tbody>
    </table>
    <!-- Glider / Motor glider -->
    <table class="records-table" id="tableGlider" style="display:none;">
      <thead><tr>
        <th>#</th><th>登録番号</th><th>機種</th><th>所属</th><th>カテゴリ</th><th>離陸時刻</th><th>着陸時刻</th><th>飛行時間</th><th>離脱高度(ft)</th><th>発航方法</th><th>着陸回数</th><th></th>
      </tr></thead>
      <tbody id="gliderBody"></tbody>
    </table>
  </div>
</div>

<!-- ══════════ Settings modal ══════════ -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>滑空場設定</h2>

    <div class="modal-field">
      <label>滑空場名</label>
      <input type="text" value="滝川スカイパーク" />
    </div>

    <h3>滑空場標点</h3>
    <div class="modal-row">
      <div class="modal-field"><label>緯度</label><input type="text" value="43.5300" /></div>
      <div class="modal-field"><label>経度</label><input type="text" value="141.9070" /></div>
      <div class="modal-field"><label>標高 (ft)</label><input type="number" value="115" /></div>
    </div>

    <h3>発航場所A（R/W 36 側）</h3>
    <div class="modal-row">
      <div class="modal-field"><label>緯度</label><input type="text" value="43.5220" /></div>
      <div class="modal-field"><label>経度</label><input type="text" value="141.9070" /></div>
      <div class="modal-field"><label>標高 (ft)</label><input type="number" value="115" /></div>
    </div>

    <h3>発航場所B（R/W 18 側）</h3>
    <div class="modal-row">
      <div class="modal-field"><label>緯度</label><input type="text" value="43.5380" /></div>
      <div class="modal-field"><label>経度</label><input type="text" value="141.9070" /></div>
      <div class="modal-field"><label>標高 (ft)</label><input type="number" value="115" /></div>
    </div>

    <h3>判定パラメータ</h3>
    <div class="modal-row">
      <div class="modal-field"><label>安全滑空比</label><input type="number" value="15" /></div>
      <div class="modal-field"><label>通信途絶判定 (秒)</label><input type="number" value="5" /></div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeSettings()">キャンセル</button>
      <button class="btn-primary" onclick="closeSettings()">保存</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════
// Configuration
// ════════════════════════════════════════════
const AIRFIELD = {
  name: '滝川スカイパーク',
  lat: 43.5300, lon: 141.9070,
  elevation_ft: 115,        // 35m ≈ 115ft
  safetyGlideRatio: 15,
  lostSignalSec: 5
};

const NM_TO_FT = 6076.12;
const FT_TO_M  = 0.3048;
const M_TO_FT  = 3.28084;
const M_TO_NM  = 1 / 1852;

// ════════════════════════════════════════════
// R/W Spinner
// ════════════════════════════════════════════
let rwA = 36; // first direction

function rwB(a) { return a <= 18 ? a + 18 : a - 18; }

function changeRW(delta) {
  rwA += delta;
  if (rwA < 1)  rwA = 36;
  if (rwA > 36) rwA = 1;
  const a = String(rwA).padStart(2, '0');
  const b = String(rwB(rwA)).padStart(2, '0');
  document.getElementById('rwDisplay').textContent = `${a} / ${b}`;
}

// ════════════════════════════════════════════
// Aircraft master data
// ════════════════════════════════════════════
// targetType: 1=glider/TMG, 2=tow, 3=heli, 8=recip, 9=jet, 13=uav
const AIRCRAFT_MASTER = [
  { flarm_id: 'DD1234', registration: 'JA2480', owner: '滝川SC', aircraft_type: 'ASK 21',       category: 'glider',       targetType: 1 },
  { flarm_id: 'DD5678', registration: 'JA21TC', owner: '滝川SC', aircraft_type: 'Duo Discus',   category: 'glider',       targetType: 1 },
  { flarm_id: 'DD9012', registration: 'JA03TC', owner: '滝川SC', aircraft_type: 'LS 8/18m',     category: 'glider',       targetType: 1 },
  { flarm_id: 'DD3456', registration: 'JA22HB', owner: '北大滑空部', aircraft_type: 'ASK 23',   category: 'glider',       targetType: 1 },
  { flarm_id: 'DD7890', registration: 'JA2590', owner: '個人',   aircraft_type: 'Discus 2cT',   category: 'motor_glider', targetType: 1 },
  { flarm_id: 'AA0001', registration: 'JA3948', owner: '滝川SC', aircraft_type: 'HK-36',        category: 'tow',          targetType: 2 },
  { flarm_id: 'AA0002', registration: 'JA3972', owner: '滝川SC', aircraft_type: 'HK-36',        category: 'tow',          targetType: 2 },
  { flarm_id: 'HH0001', registration: 'JA01HE', owner: '個人',   aircraft_type: 'R44',          category: 'helicopter',   targetType: 3 },
  { flarm_id: 'FF0099', registration: null,      owner: null,     aircraft_type: null,           category: null,           targetType: null },
];

// ════════════════════════════════════════════
// Live state per aircraft
// ════════════════════════════════════════════
const aircraftState = {};
const trailHistory = {};

function initAircraftStates() {
  const now = Date.now();
  // Tow 1 — on ground, taxiing
  aircraftState['AA0001'] = {
    lat: 43.5295, lon: 141.9060, alt_ft: 115, speed_kmh: 0,
    airborne: false, heading: 0, climb_fpm: 0, lastSeen: now
  };
  // Tow 2 — airborne, towing DD5678
  aircraftState['AA0002'] = {
    lat: 43.5420, lon: 141.9200, alt_ft: 1250, speed_kmh: 130,
    airborne: true, heading: 45, climb_fpm: 600, lastSeen: now
  };
  // Glider 1 — soaring high
  aircraftState['DD1234'] = {
    lat: 43.5550, lon: 141.8800, alt_ft: 3940, speed_kmh: 90,
    airborne: true, heading: 270, climb_fpm: 500, lastSeen: now
  };
  // Glider 2 — being towed by AA0002
  aircraftState['DD5678'] = {
    lat: 43.5425, lon: 141.9205, alt_ft: 1210, speed_kmh: 128,

// ════════════════════════════════════════════
// Helpers
// ════════════════════════════════════════════
function getAircraftMaster(id) {
  return AIRCRAFT_MASTER.find(a => a.flarm_id === id) ||
    { flarm_id: id, registration: id, owner: '不明', aircraft_type: '不明', category: null, targetType: null };
}

function getDisplayName(id) {
  return getAircraftMaster(id).registration || id;
}

function haversineM(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function distanceNm(lat1, lon1, lat2, lon2) {
  return haversineM(lat1, lon1, lat2, lon2) * M_TO_NM;
}

function isLostSignal(id) {
  return (Date.now() - aircraftState[id].lastSeen) >= AIRFIELD.lostSignalSec * 1000;
}

function isDanger(id) {
  const s = aircraftState[id];
  if (!s.airborne) return false;
  const distNm = distanceNm(AIRFIELD.lat, AIRFIELD.lon, s.lat, s.lon);
  const agl_ft = s.alt_ft - AIRFIELD.elevation_ft;
  // distance(nm) × 6076 > altitude(ft) × 15
  return distNm * NM_TO_FT > agl_ft * AIRFIELD.safetyGlideRatio;
}

function isLowAltitude(id) {
  const s = aircraftState[id];
  return s.airborne && (s.alt_ft - AIRFIELD.elevation_ft) <= 1500;
}

// ════════════════════════════════════════════
// Category badge
// ════════════════════════════════════════════
function getCategoryBadge(master) {
  const tt = master.targetType;
  switch (tt) {
    case 2:  return '<span class="category-badge badge-tow">曳航</span>';
    case 3:  return '<span class="category-badge badge-heli">回転</span>';
    case 8:  return '<span class="category-badge badge-recip">単発</span>';
    case 9:  return '<span class="category-badge badge-jet">JET</span>';
    case 13: return '<span class="category-badge badge-uav">UAV</span>';
    case 1:
      if (master.category === 'motor_glider') return '<span class="category-badge badge-motor">動滑</span>';
      return '<span class="category-badge badge-glider">滑空</span>';
    default: return '<span class="category-badge" style="background:rgba(255,255,255,0.1);color:#888;">不明</span>';
  }
}

// ════════════════════════════════════════════
// SVG aircraft icons by TargetType
// ════════════════════════════════════════════
function getIconColor(master, danger, lost) {
  if (lost)   return 'rgba(230, 57, 70, 0.4)';
  if (danger) return '#e63946';
  switch (master.targetType) {
    case 2:  return '#f4a261';
    case 3:  return '#e07be0';
    case 8:  return '#cccccc';
    case 9:  return '#ff6b6b';
    case 13: return '#ffd166';
    case 1:
      return master.category === 'motor_glider' ? '#8ac926' : '#00b4d8';
    default: return '#888888';
  }
}

function aircraftSVG(targetType, color, size, rotation) {
  const s = size;
  const r = rotation || 0;

  // Glider / Motor glider (type 1) — long wings, slender
  if (targetType === 1) {
    return `<svg width="${s*3}" height="${s*3}" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)">
      <path d="M0,-10 L1,-3 L14,0 L14,1 L1,2 L0.5,8 L3,9.5 L3,10.5 L-3,10.5 L-3,9.5 L-0.5,8 L-1,2 L-14,1 L-14,0 L-1,-3 Z" fill="${color}" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
    </svg>`;
  }
  // Tow plane (type 2) — wider body, shorter wings
  if (targetType === 2) {
    return `<svg width="${s*3}" height="${s*3}" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)">
      <path d="M0,-12 L2,-4 L10,-1 L10,1 L2,2 L1,10 L4,11 L4,12 L-4,12 L-4,11 L-1,10 L-2,2 L-10,1 L-10,-1 L-2,-4 Z" fill="${color}" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
    </svg>`;
  }
  // Helicopter (type 3) — circle with rotor blades
  if (targetType === 3) {
    return `<svg width="${s*3}" height="${s*3}" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)">
      <circle cx="0" cy="0" r="4" fill="${color}" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="${color}" stroke-width="1.5"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="${color}" stroke-width="1.5"/>
      <path d="M0,4 L2,12 L-2,12 Z" fill="${color}" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
    </svg>`;
  }
  // Reciprocating (type 8) — standard airplane shape
  if (targetType === 8) {
    return `<svg width="${s*3}" height="${s*3}" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)">
      <path d="M0,-11 L2.5,-4 L11,-1.5 L11,0.5 L2.5,2 L1.5,9 L5,10.5 L5,11.5 L-5,11.5 L-5,10.5 L-1.5,9 L-2.5,2 L-11,0.5 L-11,-1.5 L-2.5,-4 Z" fill="${color}" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
    </svg>`;
  }
  // Jet (type 9) — swept wings
  if (targetType === 9) {
    return `<svg width="${s*3}" height="${s*3}" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)">
      <path d="M0,-13 L2,-6 L12,2 L11,3 L2,2.5 L1.5,8 L4,10 L4,11 L-4,11 L-4,10 L-1.5,8 L-2,2.5 L-11,3 L-12,2 L-2,-6 Z" fill="${color}" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
    </svg>`;
  }
  // UAV (type 13) — diamond
  if (targetType === 13) {
    return `<svg width="${s*3}" height="${s*3}" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)">
      <path d="M0,-10 L7,0 L0,10 L-7,0 Z" fill="${color}" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="2" fill="rgba(0,0,0,0.3)"/>
    </svg>`;
  }
  // Unknown — question mark circle
  return `<svg width="${s*3}" height="${s*3}" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)">
    <circle cx="0" cy="0" r="8" fill="${color}" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
    <text x="0" y="4" text-anchor="middle" font-size="12" fill="rgba(0,0,0,0.6)" font-weight="bold">?</text>
  </svg>`;
}

function createAircraftIcon(flarmId) {
  const master = getAircraftMaster(flarmId);
  const state = aircraftState[flarmId];
  const lost = isLostSignal(flarmId);
  const danger = isDanger(flarmId);
  const low = isLowAltitude(flarmId);

  const color = getIconColor(master, danger, lost);
  let size = 10;
  if (low && !danger) size = 13;

  const tt = master.targetType || 0;
  const svg = aircraftSVG(tt, color, size, state.heading);

  return L.divIcon({
    html: `<div class="aircraft-icon">${svg}</div>`,
    className: '',
    iconSize: [size * 3, size * 3],
    iconAnchor: [size * 1.5, size * 1.5]
  });
}

// ════════════════════════════════════════════
// Select & blink aircraft from status view
// ════════════════════════════════════════════
function selectAircraft(flarmId) {
  // Clear previous blink
  if (selectedFlarmId && markers[selectedFlarmId]) {
    const el = markers[selectedFlarmId].getElement();
    if (el) el.classList.remove('aircraft-blink');
  }

  if (selectedFlarmId === flarmId) {
    selectedFlarmId = null;
    updateStatusView();
    return;
  }

  selectedFlarmId = flarmId;
  const s = aircraftState[flarmId];
  if (s) {
    map.setView([s.lat, s.lon], Math.max(map.getZoom(), 14));
  }

  // Start blink
  if (markers[flarmId]) {
    const el = markers[flarmId].getElement();
    if (el) el.classList.add('aircraft-blink');
  }

  updateStatusView();
}

// ════════════════════════════════════════════
// Map marker rendering
// ════════════════════════════════════════════
function updateMapMarkers() {
  Object.keys(aircraftState).forEach(flarmId => {
    const state = aircraftState[flarmId];
    const master = getAircraftMaster(flarmId);
    const name = getDisplayName(flarmId);
    const agl_ft = Math.round(state.alt_ft - AIRFIELD.elevation_ft);
    const lost = isLostSignal(flarmId);
    const danger = isDanger(flarmId);

    let labelColor = '#e8e8e8';
    if (danger) labelColor = '#e63946';
    if (lost) labelColor = 'rgba(230, 57, 70, 0.4)';

    const labelText = state.airborne ? `${name} ${agl_ft}ft` : name;

    if (markers[flarmId]) {
      markers[flarmId].setLatLng([state.lat, state.lon]);
      markers[flarmId].setIcon(createAircraftIcon(flarmId));
      markers[flarmId].getTooltip().setContent(
        `<span style="font-size:11px;font-weight:600;white-space:nowrap;color:${labelColor};text-shadow:1px 1px 2px rgba(0,0,0,0.9),-1px -1px 2px rgba(0,0,0,0.9)">${labelText}</span>`
      );
      // Preserve blink class
      if (selectedFlarmId === flarmId) {
        const el = markers[flarmId].getElement();
        if (el) el.classList.add('aircraft-blink');
      }
    } else {
      markers[flarmId] = L.marker([state.lat, state.lon], {
        icon: createAircraftIcon(flarmId)
      }).addTo(map).bindTooltip(
        `<span style="font-size:11px;font-weight:600;white-space:nowrap;color:${labelColor};text-shadow:1px 1px 2px rgba(0,0,0,0.9),-1px -1px 2px rgba(0,0,0,0.9)">${labelText}</span>`,
        { permanent: true, direction: 'right', offset: [12, 0], className: '' }
      );
    }

    // Trail (past 10 seconds of positions)
    if (trailHistory[flarmId] && trailHistory[flarmId].length > 1) {
      if (trails[flarmId]) map.removeLayer(trails[flarmId]);

      let trailColor = getIconColor(master, danger, false);
      trails[flarmId] = L.polyline(trailHistory[flarmId], {
        color: trailColor, weight: 2, opacity: 0.6
      }).addTo(map);
    }
  });
}

// ════════════════════════════════════════════
// Status view
// ════════════════════════════════════════════
function updateStatusView() {
  const lostList     = document.getElementById('lostList');
  const airborneList = document.getElementById('airborneList');
  const groundList   = document.getElementById('groundList');

  let lostHTML = '';
  let airborneItems = [];
  let groundItems = [];

  Object.keys(aircraftState).forEach(flarmId => {
    const state = aircraftState[flarmId];
    const master = getAircraftMaster(flarmId);
    const name = getDisplayName(flarmId);
    const agl_ft = Math.round(state.alt_ft - AIRFIELD.elevation_ft);
    const distM = haversineM(AIRFIELD.lat, AIRFIELD.lon, state.lat, state.lon);
    const lost = isLostSignal(flarmId);
    const danger = isDanger(flarmId);
    const active = selectedFlarmId === flarmId ? ' active' : '';

    if (lost) {
      const secAgo = Math.round((Date.now() - state.lastSeen) / 1000);
      lostHTML += `<div class="status-item lost-signal${active}" onclick="selectAircraft('${flarmId}')">
        ${getCategoryBadge(master)}
        <span class="reg">${name}</span>
        <span class="type">${master.aircraft_type || '不明'}</span>
        <span class="alt">${secAgo}秒前</span>
      </div>`;
    } else if (state.airborne) {
      airborneItems.push({ flarmId, name, master, agl_ft, danger, distM, active });
    } else {
      groundItems.push({ flarmId, name, master, distM, active });
    }
  });

  // Sort airborne by altitude descending
  airborneItems.sort((a, b) => b.agl_ft - a.agl_ft);
  // Sort ground: tow first, then by distance
  groundItems.sort((a, b) => {
    if (a.master.category === 'tow' && b.master.category !== 'tow') return -1;
    if (a.master.category !== 'tow' && b.master.category === 'tow') return 1;
    return a.distM - b.distM;
  });

  let airborneHTML = '';
  airborneItems.forEach(item => {
    const altClass = item.danger ? 'alt danger' : 'alt';
    airborneHTML += `<div class="status-item${item.active}" onclick="selectAircraft('${item.flarmId}')">
      ${getCategoryBadge(item.master)}
      <span class="reg">${item.name}</span>
      <span class="type">${item.master.aircraft_type || '不明'}</span>
      <span class="${altClass}">${item.agl_ft}ft</span>
    </div>`;
  });

  let groundHTML = '';
  groundItems.forEach(item => {
    groundHTML += `<div class="status-item${item.active}" onclick="selectAircraft('${item.flarmId}')">
      ${getCategoryBadge(item.master)}
      <span class="reg">${item.name}</span>
      <span class="type">${item.master.aircraft_type || '不明'}</span>
      <span class="alt" style="color:var(--text-secondary)">${item.master.owner || ''}</span>
    </div>`;
  });

  lostList.innerHTML     = lostHTML     || '<div class="empty-state">なし</div>';
  airborneList.innerHTML = airborneHTML || '<div class="empty-state">上空に機体なし</div>';
  groundList.innerHTML   = groundHTML   || '<div class="empty-state">地上に機体なし</div>';
}

// ════════════════════════════════════════════
// Simulation loop
// ════════════════════════════════════════════
let simTick = 0;

function simulate() {
  simTick++;
  const now = Date.now();

  Object.keys(aircraftState).forEach(flarmId => {
    const s = aircraftState[flarmId];
    if (!s.airborne || isLostSignal(flarmId)) return;

    // Move based on speed & heading
    const speedMs = s.speed_kmh / 3.6;
    const headingRad = s.heading * Math.PI / 180;
    const dlat = (speedMs * Math.cos(headingRad)) / 111320;
    const dlon = (speedMs * Math.sin(headingRad)) / (111320 * Math.cos(s.lat * Math.PI / 180));

    s.lat += dlat;
    s.lon += dlon;
    s.alt_ft += s.climb_fpm / 60; // per second

    // Per-aircraft behavior
    if (flarmId === 'DD1234') { // Thermalling
      s.heading = (s.heading + 2.5) % 360;
      s.climb_fpm = 300 + Math.sin(simTick * 0.1) * 200;
    }
    if (flarmId === 'DD9012') { // Returning
      const bearing = Math.atan2(AIRFIELD.lon - s.lon, AIRFIELD.lat - s.lat) * 180 / Math.PI;
      s.heading = (bearing + 360) % 360;
      s.climb_fpm = -200 + Math.sin(simTick * 0.05) * 100;
    }
    if (flarmId === 'DD7890') { // Motor glider circling
      s.heading = (s.heading + 1) % 360;
      s.climb_fpm = -50 + Math.sin(simTick * 0.08) * 100;
    }
    if (flarmId === 'AA0002') { // Tow climbing
      s.heading = (s.heading + 0.5) % 360;
    }
    if (flarmId === 'DD5678') { // Follow tow
      const tow = aircraftState['AA0002'];
      s.heading = tow.heading;
      s.lat = tow.lat - 0.0003;
      s.lon = tow.lon - 0.0003;
      s.alt_ft = tow.alt_ft - 30;
    }
    if (flarmId === 'HH0001') { // Helicopter passing through
      s.heading = 270;
    }

    s.lastSeen = now;

    // Trail (10 data points ≈ 10 sec)
    if (!trailHistory[flarmId]) trailHistory[flarmId] = [];
    trailHistory[flarmId].push([s.lat, s.lon]);
    if (trailHistory[flarmId].length > 10) trailHistory[flarmId].shift();
  });
}

// ════════════════════════════════════════════
// Resize handle
// ════════════════════════════════════════════
function initResize() {
  const handle = document.getElementById('resizeHandle');
  const panel  = document.getElementById('recordsPanel');
  let startY, startH;

  handle.addEventListener('mousedown', e => {
    startY = e.clientY;
    startH = panel.offsetHeight;
    const onMove = e2 => {
      panel.style.height = Math.max(100, Math.min(600, startH + startY - e2.clientY)) + 'px';
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  });
}

// ════════════════════════════════════════════
// Main loop
// ════════════════════════════════════════════
function update() {
  simulate();
  updateMapMarkers();
  updateStatusView();
  updateClock();
}

// ════════════════════════════════════════════
// Init
// ════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  initAircraftStates();
  initMap();
  initResize();

  renderTowRecords('tow1Body', mockTow1Records);
  renderTowRecords('tow2Body', mockTow2Records);
  renderGliderRecords();

  update();
  setInterval(update, 1000);
});
</script>
