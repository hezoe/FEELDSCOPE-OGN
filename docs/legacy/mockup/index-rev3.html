<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEELDSCOPE - FLARM FS Monitor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-tertiary: #0f3460;
  --bg-card: #1e2a4a;
  --text-primary: #e8e8e8;
  --text-secondary: #a0a0b0;
  --accent: #00b4d8;
  --accent-dim: #0077b6;
  --danger: #e63946;
  --danger-dim: rgba(230, 57, 70, 0.25);
  --warning: #f4a261;
  --success: #2a9d8f;
  --border: #2a3a5e;
  --tow-color: #f4a261;
  --glider-color: #00b4d8;
  --motor-glider-color: #8ac926;
  --heli-color: #e07be0;
  --recip-color: #cccccc;
  --jet-color: #ff6b6b;
  --uav-color: #ffd166;
}

body {
  font-family: 'Segoe UI', 'Meiryo', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 16px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  min-height: 48px;
  flex-shrink: 0;
}
.header-logo { font-size: 18px; font-weight: 700; letter-spacing: 2px; color: var(--accent); }
.header-airfield { font-size: 14px; color: var(--text-secondary); }
.header-controls { display: flex; align-items: center; gap: 14px; margin-left: auto; }
.header-controls label { font-size: 12px; color: var(--text-secondary); }

/* R/W Toggle Switch */
.rw-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.rw-toggle button {
  padding: 4px 14px;
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  background: var(--bg-primary);
  color: var(--text-secondary);
  border: none;
  cursor: pointer;
  transition: all 0.15s;
}
.rw-toggle button.active {
  background: var(--accent-dim);
  color: #fff;
}
.rw-toggle button:not(.active):hover {
  background: var(--bg-tertiary);
}

.header-controls button.btn-settings {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}
.header-controls button.btn-settings:hover { background: var(--accent-dim); }
.clock {
  font-size: 20px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  min-width: 70px;
  text-align: right;
}

/* ── Main ── */
.main { display: flex; flex: 1; min-height: 0; }

/* ── Map ── */
.map-container { flex: 1; position: relative; }
#map { width: 100%; height: 100%; background: #0a0a1a; }
.map-overlay-btn {
  position: absolute;
  z-index: 1000;
  background: var(--bg-secondary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 13px;
}
.map-overlay-btn:hover { background: var(--accent-dim); }
.btn-home { top: 10px; right: 10px; }
.btn-save-home { top: 44px; right: 10px; font-size: 11px; }

/* ── Status view ── */
.status-view {
  width: 280px;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
}
.status-section { border-bottom: 1px solid var(--border); }
.status-section-header {
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: var(--bg-primary);
  color: var(--text-secondary);
}
.status-section-header.danger {
  background: var(--danger-dim);
  color: var(--danger);
}
.status-item {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  gap: 8px;
  border-bottom: 1px solid rgba(42, 58, 94, 0.5);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
}
.status-item:hover { background: rgba(0, 180, 216, 0.08); }
.status-item.active { background: rgba(0, 180, 216, 0.15); outline: 1px solid var(--accent); }
.status-item.lost-signal { background: var(--danger-dim); color: rgba(230, 57, 70, 0.8); }
.status-item .reg { font-weight: 600; min-width: 65px; }
.status-item .type { color: var(--text-secondary); font-size: 11px; flex: 1; }
.status-item .alt { font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; min-width: 55px; }
.status-item .alt.danger { color: var(--danger); font-weight: 700; }
.status-item .category-badge { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 600; }

.badge-tow    { background: rgba(244,162,97,0.2);  color: var(--tow-color); }
.badge-glider { background: rgba(0,180,216,0.2);    color: var(--glider-color); }
.badge-motor  { background: rgba(138,201,38,0.2);   color: var(--motor-glider-color); }
.badge-heli   { background: rgba(224,123,224,0.2);  color: var(--heli-color); }
.badge-recip  { background: rgba(204,204,204,0.15); color: var(--recip-color); }
.badge-jet    { background: rgba(255,107,107,0.2);  color: var(--jet-color); }
.badge-uav    { background: rgba(255,209,102,0.2);  color: var(--uav-color); }

/* Blink for status list item */
@keyframes blink-status {
  0%, 100% { background: rgba(0,180,216,0.25); }
  50% { background: rgba(0,180,216,0.05); }
}
.status-item.blink {
  animation: blink-status 0.6s ease-in-out infinite;
}

/* ── Flight records ── */
.records-panel {
  height: 260px; min-height: 200px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.records-tabs {
  display: flex; align-items: center; padding: 0 8px;
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border); gap: 2px;
}
.records-tab {
  padding: 8px 16px; font-size: 13px; cursor: pointer;
  border-bottom: 2px solid transparent;
  color: var(--text-secondary); background: none;
  border-top: none; border-left: none; border-right: none;
  transition: all 0.15s;
}
.records-tab:hover { color: var(--text-primary); }
.records-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.records-tab-actions { margin-left: auto; display: flex; gap: 6px; }
.records-tab-actions button {
  background: var(--bg-tertiary); color: var(--text-primary);
  border: 1px solid var(--border); padding: 4px 10px;
  border-radius: 4px; font-size: 11px; cursor: pointer;
}
.records-tab-actions button:hover { background: var(--accent-dim); }
.records-body { flex: 1; overflow: auto; }
.records-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.records-table th {
  position: sticky; top: 0; background: var(--bg-primary);
  color: var(--text-secondary); font-weight: 600; text-align: left;
  padding: 6px 10px; border-bottom: 1px solid var(--border);
  white-space: nowrap; font-size: 11px;
}
.records-table td {
  padding: 5px 10px; border-bottom: 1px solid rgba(42,58,94,0.3);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.records-table tr:hover td { background: rgba(0,180,216,0.05); }
.records-table .editable { cursor: pointer; border-bottom: 1px dashed var(--accent-dim); }
.records-table .editable:hover { color: var(--accent); }
.records-table .flag-edu { color: var(--warning); font-weight: 600; }
.records-table .btn-row {
  padding: 2px 6px; font-size: 10px; background: var(--bg-tertiary);
  color: var(--text-secondary); border: 1px solid var(--border);
  border-radius: 3px; cursor: pointer;
}
.records-table .btn-row:hover { background: var(--accent-dim); color: var(--text-primary); }

/* ── Resize ── */
.resize-handle { height: 4px; background: var(--border); cursor: ns-resize; flex-shrink: 0; }
.resize-handle:hover { background: var(--accent); }

/* ── Settings modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 2000;
  justify-content: center; align-items: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 8px; width: 540px; max-height: 85vh;
  overflow-y: auto; padding: 24px;
}
.modal h2 { font-size: 16px; margin-bottom: 16px; color: var(--accent); }
.modal h3 {
  font-size: 13px; margin: 16px 0 8px; color: var(--text-secondary);
  border-bottom: 1px solid var(--border); padding-bottom: 4px;
}
.modal-field { margin-bottom: 10px; }
.modal-field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 3px; }
.modal-field input, .modal-field select {
  width: 100%; background: var(--bg-primary); color: var(--text-primary);
  border: 1px solid var(--border); padding: 5px 10px; border-radius: 4px; font-size: 13px;
}
.modal-row { display: flex; gap: 10px; }
.modal-row .modal-field { flex: 1; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.modal-actions button { padding: 6px 16px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; font-size: 13px; }
.modal-actions .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal-actions .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }

/* ── Blink for map marker ── */
@keyframes blink-marker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.15; }
}
.aircraft-blink .aircraft-icon { animation: blink-marker 0.6s ease-in-out infinite; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }
.empty-state { text-align: center; padding: 16px; color: var(--text-secondary); font-size: 12px; }
</style>
</head>
<body>

<!-- ══════════ Header ══════════ -->
<div class="header">
  <div class="header-logo">FEELDSCOPE</div>
  <div class="header-airfield">滝川スカイパーク</div>
  <div class="header-controls">
    <label>R/W:</label>
    <div class="rw-toggle">
      <button id="rwBtnA" class="active" onclick="toggleRW('A')">36</button>
      <button id="rwBtnB" onclick="toggleRW('B')">18</button>
    </div>
    <button class="btn-settings" onclick="openSettings()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
      設定
    </button>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</div>

<!-- ══════════ Main ══════════ -->
<div class="main">
  <div class="map-container">
    <div id="map"></div>
    <button class="map-overlay-btn btn-home" onclick="goHome()" title="ホームポジションに戻る">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg> HOME
    </button>
    <button class="map-overlay-btn btn-save-home" onclick="saveHome()" title="現在の表示をホームポジションとして保存">保存</button>
  </div>

  <div class="status-view" id="statusView">
    <div class="status-section">
      <div class="status-section-header danger">通信途絶</div>
      <div id="lostList"></div>
    </div>
    <div class="status-section">
      <div class="status-section-header">▲ 上空</div>
      <div id="airborneList"></div>
    </div>
    <div class="status-section">
      <div class="status-section-header">▼ 地上</div>
      <div id="groundList"></div>
    </div>
  </div>
</div>

<div class="resize-handle" id="resizeHandle"></div>

<!-- ══════════ Flight records ══════════ -->
<div class="records-panel" id="recordsPanel">
  <div class="records-tabs">
    <button class="records-tab active" onclick="switchTab('tow1',this)">曳航機1</button>
    <button class="records-tab" onclick="switchTab('tow2',this)">曳航機2</button>
    <button class="records-tab" onclick="switchTab('glider',this)">滑空機・動力滑空機</button>
    <div class="records-tab-actions">
      <button onclick="addRecord()">+ 追加</button>
      <button onclick="exportCSV()">CSV</button>
      <button onclick="exportExcel()">Excel</button>
    </div>
  </div>
  <div class="records-body">
    <table class="records-table" id="tableTow1">
      <thead><tr><th>#</th><th>離陸時刻</th><th>着陸時刻</th><th>被曳航機</th><th>離脱高度(ft)</th><th>備考</th><th></th></tr></thead>
      <tbody id="tow1Body"></tbody>
    </table>
    <table class="records-table" id="tableTow2" style="display:none;">
      <thead><tr><th>#</th><th>離陸時刻</th><th>着陸時刻</th><th>被曳航機</th><th>離脱高度(ft)</th><th>備考</th><th></th></tr></thead>
      <tbody id="tow2Body"></tbody>
    </table>
    <table class="records-table" id="tableGlider" style="display:none;">
      <thead><tr><th>#</th><th>登録番号</th><th>機種</th><th>所属</th><th>カテゴリ</th><th>離陸時刻</th><th>着陸時刻</th><th>飛行時間</th><th>離脱高度(ft)</th><th>発航方法</th><th>着陸回数</th><th></th></tr></thead>
      <tbody id="gliderBody"></tbody>
    </table>
  </div>
</div>

<!-- ══════════ Settings modal ══════════ -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>滑空場設定</h2>
    <div class="modal-field"><label>滑空場名</label><input type="text" value="滝川スカイパーク" /></div>

    <h3>滑空場標点</h3>
    <div class="modal-row">
      <div class="modal-field"><label>緯度</label><input type="text" value="43.5300" /></div>
      <div class="modal-field"><label>経度</label><input type="text" value="141.9070" /></div>
      <div class="modal-field"><label>標高 (ft)</label><input type="number" value="115" /></div>
    </div>

    <h3>R/W方向</h3>
    <div class="modal-row">
      <div class="modal-field"><label>方向A</label><input type="number" id="settingRwA" value="36" min="1" max="36" /></div>
      <div class="modal-field"><label>方向B</label><input type="number" id="settingRwB" value="18" min="1" max="36" /></div>
    </div>

    <h3>発航場所A（方向A側）</h3>
    <div class="modal-row">
      <div class="modal-field"><label>緯度</label><input type="text" value="43.5220" /></div>
      <div class="modal-field"><label>経度</label><input type="text" value="141.9070" /></div>
      <div class="modal-field"><label>標高 (ft)</label><input type="number" value="115" /></div>
    </div>

    <h3>発航場所B（方向B側）</h3>
    <div class="modal-row">
      <div class="modal-field"><label>緯度</label><input type="text" value="43.5380" /></div>
      <div class="modal-field"><label>経度</label><input type="text" value="141.9070" /></div>
      <div class="modal-field"><label>標高 (ft)</label><input type="number" value="115" /></div>
    </div>

    <h3>判定パラメータ</h3>
    <div class="modal-row">
      <div class="modal-field"><label>安全滑空比</label><input type="number" value="15" /></div>
      <div class="modal-field"><label>通信途絶判定 (秒)</label><input type="number" value="5" /></div>
    </div>

    <h3>表示</h3>
    <div class="modal-field">
      <label>機体ラベル表示名</label>
      <select id="settingDisplayName">
        <option value="contest_id" selected>コンテスト番号</option>
        <option value="registration">登録番号</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeSettings()">キャンセル</button>
      <button class="btn-primary" onclick="applySettings()">保存</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════
// Config
// ════════════════════════════════════════════
const AIRFIELD = {
  lat: 43.5300, lon: 141.9070, elevation_ft: 115,
  safetyGlideRatio: 15, lostSignalSec: 5
};
const NM_TO_FT = 6076.12;
const M_TO_NM = 1 / 1852;

let displayMode = 'contest_id'; // or 'registration'
let rwDirectionA = '36';
let rwDirectionB = '18';
let activeRW = 'A';

// ════════════════════════════════════════════
// R/W Toggle
// ════════════════════════════════════════════
function toggleRW(side) {
  activeRW = side;
  document.getElementById('rwBtnA').classList.toggle('active', side === 'A');
  document.getElementById('rwBtnB').classList.toggle('active', side === 'B');
}

// ════════════════════════════════════════════
// Aircraft master
// ════════════════════════════════════════════
const AIRCRAFT_MASTER = [
  { flarm_id:'DD1234', registration:'JA2480', contest_id:'TC', owner:'滝川SC',    aircraft_type:'ASK 21',     category:'glider',       targetType:1 },
  { flarm_id:'DD5678', registration:'JA21TC', contest_id:'DD', owner:'滝川SC',    aircraft_type:'Duo Discus', category:'glider',       targetType:1 },
  { flarm_id:'DD9012', registration:'JA03TC', contest_id:'LS', owner:'滝川SC',    aircraft_type:'LS 8/18m',   category:'glider',       targetType:1 },
  { flarm_id:'DD3456', registration:'JA22HB', contest_id:'HB', owner:'北大滑空部', aircraft_type:'ASK 23',     category:'glider',       targetType:1 },
  { flarm_id:'DD7890', registration:'JA2590', contest_id:'D2', owner:'個人',      aircraft_type:'Discus 2cT', category:'motor_glider', targetType:1 },
  { flarm_id:'AA0001', registration:'JA3948', contest_id:null, owner:'滝川SC',    aircraft_type:'HK-36',      category:'tow',          targetType:2 },
  { flarm_id:'AA0002', registration:'JA3972', contest_id:null, owner:'滝川SC',    aircraft_type:'HK-36',      category:'tow',          targetType:2 },
  { flarm_id:'HH0001', registration:'JA01HE', contest_id:null, owner:'個人',      aircraft_type:'R44',        category:'helicopter',   targetType:3 },
  { flarm_id:'FF0099', registration:null,      contest_id:null, owner:null,        aircraft_type:null,         category:null,           targetType:null },
];

function getMaster(id) {
  return AIRCRAFT_MASTER.find(a => a.flarm_id === id) ||
    { flarm_id:id, registration:id, contest_id:null, owner:'不明', aircraft_type:'不明', category:null, targetType:null };
}

function getDisplayName(id) {
  const m = getMaster(id);
  if (!m.registration && !m.contest_id) return id; // unknown → FLARM ID
  if (displayMode === 'contest_id' && m.contest_id) return m.contest_id;
  return m.registration || id;
}

// ════════════════════════════════════════════
// State
// ════════════════════════════════════════════
const aircraftState = {};
const trailHistory = {};
const TRAIL_LENGTH = 60; // 60 seconds

function initStates() {
  const now = Date.now();
  aircraftState['AA0001'] = { lat:43.5295, lon:141.9060, alt_ft:115,  speed:0,   airborne:false, heading:0,   climb:0,    lastSeen:now };
  aircraftState['AA0002'] = { lat:43.5420, lon:141.9200, alt_ft:1250, speed:130, airborne:true,  heading:45,  climb:600,  lastSeen:now };
  aircraftState['DD1234'] = { lat:43.5550, lon:141.8800, alt_ft:3940, speed:90,  airborne:true,  heading:270, climb:500,  lastSeen:now };
  aircraftState['DD5678'] = { lat:43.5425, lon:141.9205, alt_ft:1210, speed:128, airborne:true,  heading:45,  climb:600,  lastSeen:now };
  aircraftState['DD9012'] = { lat:43.5150, lon:141.9400, alt_ft:1050, speed:105, airborne:true,  heading:310, climb:-300, lastSeen:now };
  aircraftState['DD3456'] = { lat:43.5302, lon:141.9075, alt_ft:115,  speed:0,   airborne:false, heading:0,   climb:0,    lastSeen:now };
  aircraftState['DD7890'] = { lat:43.5900, lon:141.8200, alt_ft:1480, speed:120, airborne:true,  heading:200, climb:-100, lastSeen:now };
  aircraftState['HH0001'] = { lat:43.5450, lon:141.9500, alt_ft:2500, speed:180, airborne:true,  heading:270, climb:0,    lastSeen:now };
  aircraftState['FF0099'] = { lat:43.5400, lon:141.9500, alt_ft:1970, speed:80,  airborne:true,  heading:180, climb:0,    lastSeen:now - 8000 };
  Object.keys(aircraftState).forEach(id => { trailHistory[id] = []; });
}

// ════════════════════════════════════════════
// Calculations
// ════════════════════════════════════════════
function haversineM(lat1, lon1, lat2, lon2) {
  const R = 6371000, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function isLost(id) { return (Date.now() - aircraftState[id].lastSeen) >= AIRFIELD.lostSignalSec*1000; }
function isDanger(id) {
  const s = aircraftState[id]; if (!s.airborne) return false;
  const dNm = haversineM(AIRFIELD.lat, AIRFIELD.lon, s.lat, s.lon) * M_TO_NM;
  return dNm * NM_TO_FT > (s.alt_ft - AIRFIELD.elevation_ft) * AIRFIELD.safetyGlideRatio;
}
function isLow(id) { const s = aircraftState[id]; return s.airborne && (s.alt_ft - AIRFIELD.elevation_ft) <= 1500; }

// ════════════════════════════════════════════
// Selection & blinking (bidirectional)
// ════════════════════════════════════════════
let selectedId = null;

function clearSelection() {
  if (selectedId) {
    // Clear map marker blink
    if (markers[selectedId]) {
      const el = markers[selectedId].getElement();
      if (el) el.classList.remove('aircraft-blink');
    }
    // Clear status list blink — handled by re-render
    selectedId = null;
    updateStatusView();
  }
}

// Called from status view: center map + blink marker
function selectFromList(flarmId) {
  clearSelection();
  selectedId = flarmId;
  const s = aircraftState[flarmId];
  if (s) map.setView([s.lat, s.lon], Math.max(map.getZoom(), 14));
  if (markers[flarmId]) {
    const el = markers[flarmId].getElement();
    if (el) el.classList.add('aircraft-blink');
  }
  updateStatusView();
}

// Called from map marker click: blink status list item
function selectFromMap(flarmId) {
  clearSelection();
  selectedId = flarmId;
  updateStatusView(); // will add .blink class to status item
}

// ════════════════════════════════════════════
// Category badge
// ════════════════════════════════════════════
function badge(master) {
  const t = master.targetType;
  if (t === 2)  return '<span class="category-badge badge-tow">曳航</span>';
  if (t === 3)  return '<span class="category-badge badge-heli">回転</span>';
  if (t === 8)  return '<span class="category-badge badge-recip">単発</span>';
  if (t === 9)  return '<span class="category-badge badge-jet">JET</span>';
  if (t === 13) return '<span class="category-badge badge-uav">UAV</span>';
  if (t === 1)  return master.category === 'motor_glider'
    ? '<span class="category-badge badge-motor">動滑</span>'
    : '<span class="category-badge badge-glider">滑空</span>';
  return '<span class="category-badge" style="background:rgba(255,255,255,0.1);color:#888">不明</span>';
}

// ════════════════════════════════════════════
// SVG icons by TargetType
// ════════════════════════════════════════════
function iconColor(master, danger, lost) {
  if (lost)   return 'rgba(230,57,70,0.4)';
  if (danger) return '#e63946';
  const t = master.targetType;
  if (t === 2)  return '#f4a261';
  if (t === 3)  return '#e07be0';
  if (t === 8)  return '#cccccc';
  if (t === 9)  return '#ff6b6b';
  if (t === 13) return '#ffd166';
  if (t === 1)  return master.category === 'motor_glider' ? '#8ac926' : '#00b4d8';
  return '#888';
}

function svgIcon(tt, c, r) {
  if (tt===1) return `<svg width="30" height="30" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)"><path d="M0,-10 L1,-3 L14,0 L14,1 L1,2 L.5,8 L3,9.5 L3,10.5 L-3,10.5 L-3,9.5 L-.5,8 L-1,2 L-14,1 L-14,0 L-1,-3Z" fill="${c}" stroke="rgba(0,0,0,.5)" stroke-width=".5"/></svg>`;
  if (tt===2) return `<svg width="30" height="30" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)"><path d="M0,-12 L2,-4 L10,-1 L10,1 L2,2 L1,10 L4,11 L4,12 L-4,12 L-4,11 L-1,10 L-2,2 L-10,1 L-10,-1 L-2,-4Z" fill="${c}" stroke="rgba(0,0,0,.5)" stroke-width=".5"/></svg>`;
  if (tt===3) return `<svg width="30" height="30" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)"><circle cx="0" cy="0" r="4" fill="${c}" stroke="rgba(0,0,0,.5)" stroke-width=".5"/><line x1="-12" y1="0" x2="12" y2="0" stroke="${c}" stroke-width="1.5"/><line x1="0" y1="-12" x2="0" y2="12" stroke="${c}" stroke-width="1.5"/><path d="M0,4 L2,12 L-2,12Z" fill="${c}" stroke="rgba(0,0,0,.5)" stroke-width=".5"/></svg>`;
  if (tt===8) return `<svg width="30" height="30" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)"><path d="M0,-11 L2.5,-4 L11,-1.5 L11,.5 L2.5,2 L1.5,9 L5,10.5 L5,11.5 L-5,11.5 L-5,10.5 L-1.5,9 L-2.5,2 L-11,.5 L-11,-1.5 L-2.5,-4Z" fill="${c}" stroke="rgba(0,0,0,.5)" stroke-width=".5"/></svg>`;
  if (tt===9) return `<svg width="30" height="30" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)"><path d="M0,-13 L2,-6 L12,2 L11,3 L2,2.5 L1.5,8 L4,10 L4,11 L-4,11 L-4,10 L-1.5,8 L-2,2.5 L-11,3 L-12,2 L-2,-6Z" fill="${c}" stroke="rgba(0,0,0,.5)" stroke-width=".5"/></svg>`;
  if (tt===13) return `<svg width="30" height="30" viewBox="-15 -15 30 30" style="transform:rotate(${r}deg)"><path d="M0,-10 L7,0 L0,10 L-7,0Z" fill="${c}" stroke="rgba(0,0,0,.5)" stroke-width=".5"/><circle cx="0" cy="0" r="2" fill="rgba(0,0,0,.3)"/></svg>`;
  return `<svg width="30" height="30" viewBox="-15 -15 30 30"><circle cx="0" cy="0" r="8" fill="${c}" stroke="rgba(0,0,0,.5)" stroke-width=".5"/><text x="0" y="4" text-anchor="middle" font-size="12" fill="rgba(0,0,0,.6)" font-weight="bold">?</text></svg>`;
}

function makeIcon(id) {
  const m = getMaster(id), s = aircraftState[id];
  const lost = isLost(id), danger = isDanger(id), low = isLow(id);
  const c = iconColor(m, danger, lost);
  const sz = (low && !danger) ? 13 : 10;
  const html = svgIcon(m.targetType || 0, c, s.heading);
  return L.divIcon({ html: `<div class="aircraft-icon">${html}</div>`, className: '', iconSize: [30,30], iconAnchor: [15,15] });
}

// Map
// ════════════════════════════════════════════
let map, markers = {}, trails = {};
let homePosition = { lat: 43.5350, lon: 141.9070, zoom: 13 };

function initMap() {
  map = L.map('map', { center: [homePosition.lat, homePosition.lon], zoom: homePosition.zoom });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 18
  }).addTo(map);

  L.circleMarker([AIRFIELD.lat, AIRFIELD.lon], {
    radius: 6, color: '#fff', fillColor: '#fff', fillOpacity: 0.4, weight: 2
  }).addTo(map).bindTooltip('滝川スカイパーク (115ft)');

  const rw = 0.008;
  L.polyline([[AIRFIELD.lat-rw, AIRFIELD.lon],[AIRFIELD.lat+rw, AIRFIELD.lon]],
    { color:'#fff', weight:2, opacity:0.4, dashArray:'6,4' }).addTo(map);

  // Click anywhere on map → clear selection
  map.on('click', () => clearSelection());
}

function goHome() { map.setView([homePosition.lat, homePosition.lon], homePosition.zoom); }
function saveHome() {
  const c = map.getCenter();
  homePosition = { lat: c.lat, lon: c.lng, zoom: map.getZoom() };
  alert('ホームポジションを保存しました');
}

function updateMarkers() {
  Object.keys(aircraftState).forEach(id => {
    const s = aircraftState[id], m = getMaster(id);
    const name = getDisplayName(id);
    const agl = Math.round(s.alt_ft - AIRFIELD.elevation_ft);
    const lost = isLost(id), danger = isDanger(id);

    let lc = '#e8e8e8';
    if (danger) lc = '#e63946';
    if (lost)   lc = 'rgba(230,57,70,0.4)';
    const label = s.airborne ? `${name} ${agl}ft` : name;
    const tooltip = `<span style="font-size:11px;font-weight:600;white-space:nowrap;color:${lc};text-shadow:1px 1px 2px rgba(0,0,0,.9),-1px -1px 2px rgba(0,0,0,.9)">${label}</span>`;

    if (markers[id]) {
      markers[id].setLatLng([s.lat, s.lon]).setIcon(makeIcon(id));
      markers[id].getTooltip().setContent(tooltip);
      if (selectedId === id) {
        const el = markers[id].getElement();
        if (el) el.classList.add('aircraft-blink');
      }
    } else {
      markers[id] = L.marker([s.lat, s.lon], { icon: makeIcon(id) })
        .addTo(map)
        .bindTooltip(tooltip, { permanent: true, direction: 'right', offset: [12,0], className: '' });
      // Map icon click → blink status list
      markers[id].on('click', (e) => { L.DomEvent.stopPropagation(e); selectFromMap(id); });
    }

    // Trail (60 sec)
    if (trailHistory[id] && trailHistory[id].length > 1) {
      if (trails[id]) map.removeLayer(trails[id]);
      trails[id] = L.polyline(trailHistory[id], {
        color: iconColor(m, danger, false), weight: 2, opacity: 0.5
      }).addTo(map);
    }
  });
}

// ════════════════════════════════════════════
// Status view
// ════════════════════════════════════════════
function updateStatusView() {
  let lostHTML = '', airborne = [], ground = [];

  Object.keys(aircraftState).forEach(id => {
    const s = aircraftState[id], m = getMaster(id);
    const name = getDisplayName(id);
    const agl = Math.round(s.alt_ft - AIRFIELD.elevation_ft);
    const dist = haversineM(AIRFIELD.lat, AIRFIELD.lon, s.lat, s.lon);
    const lost = isLost(id), danger = isDanger(id);
    const blinkCls = (selectedId === id) ? ' blink' : '';
    const activeCls = (selectedId === id) ? ' active' : '';

    if (lost) {
      const sec = Math.round((Date.now() - s.lastSeen) / 1000);
      lostHTML += `<div class="status-item lost-signal${blinkCls}" onclick="selectFromList('${id}')">
        ${badge(m)}<span class="reg">${name}</span><span class="type">${m.aircraft_type||'不明'}</span><span class="alt">${sec}秒前</span>
      </div>`;
    } else if (s.airborne) {
      airborne.push({ id, name, m, agl, danger, dist, blinkCls });
    } else {
      ground.push({ id, name, m, dist, blinkCls });
    }
  });

  airborne.sort((a, b) => b.agl - a.agl);
  ground.sort((a, b) => {
    if (a.m.category==='tow' && b.m.category!=='tow') return -1;
    if (a.m.category!=='tow' && b.m.category==='tow') return 1;
    return a.dist - b.dist;
  });

  document.getElementById('lostList').innerHTML = lostHTML || '<div class="empty-state">なし</div>';

  document.getElementById('airborneList').innerHTML = airborne.length
    ? airborne.map(i => `<div class="status-item${i.blinkCls}" onclick="selectFromList('${i.id}')">
        ${badge(i.m)}<span class="reg">${i.name}</span><span class="type">${i.m.aircraft_type||'不明'}</span>
        <span class="alt${i.danger?' danger':''}">${i.agl}ft</span>
      </div>`).join('')
    : '<div class="empty-state">上空に機体なし</div>';

  document.getElementById('groundList').innerHTML = ground.length
    ? ground.map(i => `<div class="status-item${i.blinkCls}" onclick="selectFromList('${i.id}')">
        ${badge(i.m)}<span class="reg">${i.name}</span><span class="type">${i.m.aircraft_type||'不明'}</span>
        <span class="alt" style="color:var(--text-secondary)">${i.m.owner||''}</span>
      </div>`).join('')
    : '<div class="empty-state">地上に機体なし</div>';
}

// ════════════════════════════════════════════
// Simulation
// ════════════════════════════════════════════
let tick = 0;
function simulate() {
  tick++;
  const now = Date.now();
  Object.keys(aircraftState).forEach(id => {
    const s = aircraftState[id];
    if (!s.airborne || isLost(id)) return;

    const v = s.speed / 3.6;
    const hr = s.heading * Math.PI / 180;
    s.lat += (v * Math.cos(hr)) / 111320;
    s.lon += (v * Math.sin(hr)) / (111320 * Math.cos(s.lat * Math.PI / 180));
    s.alt_ft += s.climb / 60;

    if (id==='DD1234') { s.heading=(s.heading+2.5)%360; s.climb=300+Math.sin(tick*.1)*200; }
    if (id==='DD9012') { const b=Math.atan2(AIRFIELD.lon-s.lon,AIRFIELD.lat-s.lat)*180/Math.PI; s.heading=(b+360)%360; s.climb=-200+Math.sin(tick*.05)*100; }
    if (id==='DD7890') { s.heading=(s.heading+1)%360; s.climb=-50+Math.sin(tick*.08)*100; }
    if (id==='AA0002') { s.heading=(s.heading+.5)%360; }
    if (id==='DD5678') { const t=aircraftState['AA0002']; s.heading=t.heading; s.lat=t.lat-.0003; s.lon=t.lon-.0003; s.alt_ft=t.alt_ft-30; }
    if (id==='HH0001') { s.heading=270; }

    s.lastSeen = now;
    if (!trailHistory[id]) trailHistory[id] = [];
    trailHistory[id].push([s.lat, s.lon]);
    if (trailHistory[id].length > TRAIL_LENGTH) trailHistory[id].shift();
  });
}

// ════════════════════════════════════════════
// Resize
// ════════════════════════════════════════════
function initResize() {
  const h = document.getElementById('resizeHandle'), p = document.getElementById('recordsPanel');
  let y0, h0;
  h.addEventListener('mousedown', e => {
    y0 = e.clientY; h0 = p.offsetHeight;
    const mv = e2 => { p.style.height = Math.max(100, Math.min(600, h0+y0-e2.clientY))+'px'; };
    const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
    e.preventDefault();
  });
}
