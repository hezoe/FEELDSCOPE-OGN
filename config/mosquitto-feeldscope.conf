# FEELDSCOPE Mosquitto configuration
# R-013 (2026-11-11): LAN からの無認証 publish を遮断する。
# - 1883 (MQTT): 機体内部のプロセス(ogn-mqtt.py / igc-simulator)専用 → 127.0.0.1 のみで待ち受け
# - 9001 (WebSocket): LAN のブラウザ(webapp)用 → 匿名は ogn/# の購読のみ(ACL)。publish 不可
per_listener_settings true

listener 1883 127.0.0.1
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
acl_file /etc/mosquitto/conf.d/feeldscope-ws.acl
