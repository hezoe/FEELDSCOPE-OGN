# /etc/systemd/system/rtlsdr-ogn.service.d/feeldscope-wait-time.conf
# OGN の受信(rtlsdr-ogn)を時計が合ってから始める。時計が狂ったまま始めると FLARM の位置が
# でたらめに解読され OGN 全体へ配信される(2026-10-18 関宿)。合わなければ起動は失敗にし、
# 2分ごとの受信機の見張り(feeldscope-ogn-watchdog)が時計が合ってから起動する。
[Unit]
After=network-online.target chrony.service
Wants=network-online.target

[Service]
ExecStartPre=/usr/local/sbin/feeldscope-wait-time.sh 180
TimeoutStartSec=300
